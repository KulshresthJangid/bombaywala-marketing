<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DCGYQ853NF"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DCGYQ853NF');
    </script>

    <!-- Primary SEO -->
    <!--
      NOTE: title, meta description, canonical, robots, og:title, og:description
      and og:url are intentionally NOT hardcoded here. This is a pure client-
      rendered SPA (no SSR/prerendering) served as the same index.html for
      every route (see vercel.json rewrites). react-helmet-async only ever
      APPENDS its tags — it does not know about or remove tags that were
      already in this static file — so every one of those tags used to exist
      TWICE in the DOM on every page: once hardcoded here always pointing at
      the homepage, and once correctly set per-page by the <SEO>/<PageSEO>
      component. Duplicate/conflicting canonical tags cause Google to ignore
      both and pick its own guess (usually the homepage), which is why pages
      like /case-studies weren't indexing separately. Every route already
      renders <SEO>/<PageSEO> with its own title/description/canonical/robots,
      so this file must not set any of them statically. Do not add them back.
    -->
    <meta name="keywords" content="digital marketing agency Jaipur, SEO services Jaipur, PPC agency Jaipur, social media marketing Jaipur, Shopify development Jaipur, ecommerce marketing Jaipur, performance marketing India" />
    <meta name="author" content="Bombaywala Marketing" />

    <!-- Open Graph / Twitter fallback (generic, page-independent — safe as a
         static default since <SEO> renders its own og:title/description/url
         per page once JS runs; this only covers the pre-hydration instant
         and non-JS social unfurl bots) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bombaywala Marketing" />
    <meta property="og:image" content="https://www.bombaywalamarketing.com/bombaywala-logo.png" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.bombaywalamarketing.com/bombaywala-logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/bombaywala-logo.png" />
    <link rel="apple-touch-icon" href="/bombaywala-logo.png" />
